<svg width="640" height="640" viewBox="0 0 640 640" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
<stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
</linearGradient>
</defs>
<!-- Background circle -->
<circle cx="320" cy="320" r="280" fill="url(#bgGradient)" />
<!-- Hawk silhouette -->
<g transform="translate(320, 280)">
<!-- Wing left -->
<path d="M -80,-60 Q -140,-40 -160,-20 Q -140,-30 -100,-45 Z" fill="#000000" opacity="0.8"/>
<!-- Wing right -->
<path d="M 80,-60 Q 140,-40 160,-20 Q 140,-30 100,-45 Z" fill="#000000" opacity="0.8"/>
<!-- Head and body -->
<ellipse cx="0" cy="-40" rx="50" ry="60" fill="#000000"/>
<!-- Beak -->
<path d="M 0,-70 L 15,-85 L 0,-80 Z" fill="#ffffff"/>
<!-- Eye -->
<circle cx="12" cy="-50" r="6" fill="#ffffff"/>
<circle cx="12" cy="-50" r="3" fill="#1e3a8a"/>
<!-- Tail -->
<path d="M -30,20 L 0,80 L 30,20 Z" fill="#000000" opacity="0.8"/>
<!-- Chest accent -->
<ellipse cx="0" cy="0" rx="35" ry="45" fill="#ffffff" opacity="0.9"/>
<!-- Inner chest -->
<ellipse cx="0" cy="5" rx="25" ry="35" fill="#1e3a8a"/>
<!-- Status indicator (uptime pulse) -->
<circle cx="0" cy="5" r="8" fill="#ffffff">
<animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
</svg>
